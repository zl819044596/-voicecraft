# AI Video Studio — reverse proxy (production, HTTPS)
#
# Single public entrypoint for the whole compose network:
#   :80   → ACME HTTP-01 challenge (/.well-known/acme-challenge/) + 301 → HTTPS
#   :443  → TLS termination → web (Next.js) via /, api (Express) via /api/,
#           render (ffmpeg worker) via /render/ (operator/debug only)
#
# Domain-agnostic on purpose (server_name _ + $host redirects): the image
# works for any domain without a rebuild. Real Let's Encrypt certs are
# mounted at /etc/nginx/certs/fullchain.pem + privkey.pem (see
# scripts/issue-cert.sh). If no certs exist yet, scripts/ensure-certs.sh
# generates a self-signed pair so local/dev HTTPS still works end-to-end.
#
# R6 (deployment security): TLS 1.2/1.3, HSTS + hardening headers, only
# ports 80/443 published — every other container stays off the public net.

upstream api_upstream {
    server api:4000;
}

upstream render_upstream {
    server render:4001;
}

# ---------------------------------------------------------------------------
# HTTPS server — all real traffic terminates here
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5:!3DES;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # --- Hardening headers (R6) ---
    include /etc/nginx/conf.d/security-headers.conf;

    # Long render jobs (S7) — webhook-free internal pipeline, but API responses
    # for render tasks can be slow; keep generous timeouts.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    client_max_body_size 50m;

    # --- Static compression (Vite SPA assets) ---
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Frontend (Vite SPA — app/ 新前端, 静态托管)
    # Hashed assets: long cache, immutable.
    location /assets/ {
        root /www/app;
        expires 30d;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/conf.d/security-headers.conf;
        try_files $uri =404;
    }

    # SPA entry: any route (/, /login, /app/*) falls back to index.html.
    # index.html must never be cached: hashed assets in /assets/ get 30d
    # immutable, but the entry document must always revalidate so a new
    # deploy is picked up on next open (was heuristic-cached by browsers).
    location / {
        root /www/app;
        try_files $uri $uri/ /index.html;
        index index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        include /etc/nginx/conf.d/security-headers.conf;
    }

    # Backend API — /api/* proxied verbatim to api:4000/api/* (the API mounts
    # every route under /api per the interface contract; no prefix rewrite).
    location /api/ {
        proxy_pass http://api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Stream large bodies (export zips, final.mp4) straight through instead
        # of buffering them to a temp file; a mid-body abort on a slow LAN then
        # fails the download cleanly instead of wedging the proxy buffer.
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
    }

    # Render worker health/debug — not user-facing, proxied for convenience
    location /render/ {
        proxy_pass http://render_upstream/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ---------------------------------------------------------------------------
# HTTP server — ACME challenge only, everything else 301 → HTTPS
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Let's Encrypt HTTP-01 challenge (webroot shared with the certbot
    # container via the ./certs/webroot bind mount).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
