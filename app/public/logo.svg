<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="avsg" x1="8" y1="8" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7C5CFF"/>
      <stop offset="1" stop-color="#2DD4BF"/>
    </linearGradient>
    <filter id="avsglow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- stacked storyboard frames -->
  <g filter="url(#avsglow)">
    <rect x="14" y="10" width="36" height="24" rx="5" stroke="url(#avsg)" stroke-width="2.5" opacity="0.45"/>
    <rect x="10" y="20" width="36" height="24" rx="5" stroke="url(#avsg)" stroke-width="2.5" opacity="0.7"/>
    <rect x="18" y="30" width="36" height="24" rx="5" fill="#0E0E15" stroke="url(#avsg)" stroke-width="2.5"/>
    <!-- play triangle -->
    <path d="M33 37.5 L45 42 L33 46.5 Z" fill="url(#avsg)"/>
  </g>
</svg>
