# AI 工具站 — 本地开发 Docker 服务
# 用法: docker compose -f docker-compose.dev.yml up -d compose

name: ai-tool-station-dev

services:
  compose:
    build:
      context: ./compose
      dockerfile: Dockerfile
    image: avs/compose:dev
    restart: unless-stopped
    ports:
      - "127.0.0.1:4002:4002"
    environment:
      PORT: 4002
      COMPOSE_SERVICE_SECRET: ${COMPOSE_SERVICE_SECRET:-}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:4002/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
